name: Build JARVIS OpenAI TTS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add OpenAI TTS API
        shell: bash
        run: |
          mkdir -p app/src/main/kotlin/com/jarvis/assistant/voice

          cat > app/src/main/kotlin/com/jarvis/assistant/voice/OpenAiTtsApi.kt <<'EOF'
          package com.jarvis.assistant.voice

          import com.google.gson.JsonObject
          import okhttp3.ResponseBody
          import retrofit2.http.Body
          import retrofit2.http.Header
          import retrofit2.http.POST

          interface OpenAiTtsApi {

              @POST("v1/audio/speech")
              suspend fun createSpeech(
                  @Header("Authorization") authHeader: String,
                  @Body request: JsonObject
              ): ResponseBody
          }
          EOF

      - name: Replace Android TTS with OpenAI TTS
        shell: bash
        run: |
          cat > app/src/main/kotlin/com/jarvis/assistant/voice/TextToSpeechManager.kt <<'EOF'
          package com.jarvis.assistant.voice

          import android.content.Context
          import android.media.MediaPlayer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import com.google.gson.JsonObject
          import com.jarvis.assistant.data.local.prefs.SecurePrefs
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import retrofit2.Retrofit
          import retrofit2.converter.gson.GsonConverterFactory
          import java.io.File
          import java.util.Locale
          import java.util.UUID
          import java.util.concurrent.TimeUnit
          import kotlin.coroutines.resume

          data class JarvisVoice(
              val name: String,
              val displayLabel: String,
              val likelyMale: Boolean
          )

          class TextToSpeechManager(
              context: Context,
              private val prefs: SecurePrefs
          ) {

              private val appContext = context.applicationContext

              private var tts: TextToSpeech? = null
              private var ready = false

              private var mediaPlayer: MediaPlayer? = null

              private var speechRate = 1.0f
              private var speechPitch = 1.0f

              private var selectedVoice = "cedar"

              private val voices = listOf(
                  JarvisVoice("cedar", "Cedar · OpenAI AI voice", true),
                  JarvisVoice("onyx", "Onyx · OpenAI AI voice", true),
                  JarvisVoice("echo", "Echo · OpenAI AI voice", true),
                  JarvisVoice("ash", "Ash · OpenAI AI voice", true),
                  JarvisVoice("ballad", "Ballad · OpenAI AI voice", true),
                  JarvisVoice("verse", "Verse · OpenAI AI voice", true),
                  JarvisVoice("marin", "Marin · OpenAI AI voice", false),
                  JarvisVoice("alloy", "Alloy · OpenAI AI voice", false),
                  JarvisVoice("fable", "Fable · OpenAI AI voice", false),
                  JarvisVoice("coral", "Coral · OpenAI AI voice", false),
                  JarvisVoice("nova", "Nova · OpenAI AI voice", false),
                  JarvisVoice("sage", "Sage · OpenAI AI voice", false),
                  JarvisVoice("shimmer", "Shimmer · OpenAI AI voice", false)
              )

              private val api: OpenAiTtsApi by lazy {
                  val client = OkHttpClient.Builder()
                      .connectTimeout(20, TimeUnit.SECONDS)
                      .readTimeout(90, TimeUnit.SECONDS)
                      .writeTimeout(30, TimeUnit.SECONDS)
                      .callTimeout(120, TimeUnit.SECONDS)
                      .build()

                  Retrofit.Builder()
                      .baseUrl("https://api.openai.com/")
                      .client(client)
                      .addConverterFactory(GsonConverterFactory.create())
                      .build()
                      .create(OpenAiTtsApi::class.java)
              }

              init {
                  selectedVoice = prefs.voiceName
                      ?.takeIf { value -> voices.any { it.name == value } }
                      ?: "cedar"

                  tts = TextToSpeech(appContext) { status ->
                      ready = status == TextToSpeech.SUCCESS

                      if (ready) {
                          tts?.setSpeechRate(speechRate)
                          tts?.setPitch(speechPitch)
                      }
                  }
              }

              fun setLanguage(tag: String?) {
                  val locale =
                      tag?.let { Locale.forLanguageTag(it) }
                          ?: Locale.getDefault()

                  tts?.language = locale
              }

              fun setRate(rate: Float) {
                  speechRate = rate.coerceIn(0.25f, 2.0f)
                  tts?.setSpeechRate(speechRate)
              }

              fun setPitch(pitch: Float) {
                  speechPitch = pitch.coerceIn(0.5f, 2.0f)
                  tts?.setPitch(speechPitch)
              }

              fun listVoices(): List<JarvisVoice> = voices

              fun autoSelectMaleVoice(): String? =
                  voices.firstOrNull { it.likelyMale }?.name

              fun setVoice(name: String?) {
                  if (name.isNullOrBlank()) return

                  if (voices.any { it.name == name }) {
                      selectedVoice = name
                      prefs.voiceName = name
                  }
              }

              suspend fun speak(text: String): Boolean {
                  val cleanText = text.trim()

                  if (cleanText.isBlank()) {
                      return true
                  }

                  val key = prefs.aiApiKey

                  if (!key.isNullOrBlank()) {
                      val result = runCatching {
                          speakOpenAi(key, cleanText)
                      }.getOrNull()

                      if (result == true) {
                          return true
                      }
                  }

                  return speakAndroid(cleanText)
              }

              private suspend fun speakOpenAi(
                  apiKey: String,
                  text: String
              ): Boolean {

                  val request = JsonObject().apply {

                      addProperty(
                          "model",
                          "gpt-4o-mini-tts"
                      )

                      addProperty(
                          "voice",
                          selectedVoice
                      )

                      addProperty(
                          "input",
                          text.take(4096)
                      )

                      addProperty(
                          "instructions",
                          """
                          Speak as a calm, deep, confident male AI assistant.

                          Use a low, warm, natural register.
                          Speak clearly with controlled pacing.
                          Sound intelligent, composed and sophisticated.
                          Use subtle authority.

                          Do not sound robotic.
                          Do not sound theatrical.
                          Do not exaggerate emotions.
                          Do not speak too quickly.
                          """.trimIndent()
                      )

                      addProperty(
                          "response_format",
                          "mp3"
                      )

                      addProperty(
                          "speed",
                          speechRate.coerceIn(0.25f, 4.0f)
                      )
                  }

                  val file = File.createTempFile(
                      "jarvis_tts_",
                      ".mp3",
                      appContext.cacheDir
                  )

                  try {

                      withContext(Dispatchers.IO) {

                          val body = api.createSpeech(
                              authHeader = "Bearer $apiKey",
                              request = request
                          )

                          body.use { response ->

                              response.byteStream().use { input ->

                                  file.outputStream().use { output ->
                                      input.copyTo(output)
                                  }
                              }
                          }
                      }

                      playFile(file)

                  } finally {
                      file.delete()
                  }
              }

              private suspend fun playFile(
                  file: File
              ): Boolean =
                  suspendCancellableCoroutine { continuation ->

                      val player = MediaPlayer()

                      mediaPlayer?.runCatching {
                          stop()
                      }

                      mediaPlayer?.release()

                      mediaPlayer = player

                      fun finish(success: Boolean) {

                          if (mediaPlayer === player) {
                              mediaPlayer = null
                          }

                          player.release()

                          if (continuation.isActive) {
                              continuation.resume(success)
                          }
                      }

                      try {

                          player.setDataSource(
                              file.absolutePath
                          )

                          player.setOnPreparedListener {
                              if (continuation.isActive) {
                                  it.start()
                              }
                          }

                          player.setOnCompletionListener {
                              finish(true)
                          }

                          player.setOnErrorListener { _, _, _ ->
                              finish(false)
                              true
                          }

                          player.prepare()

                          continuation.invokeOnCancellation {
                              runCatching {
                                  player.stop()
                              }

                              runCatching {
                                  player.release()
                              }

                              if (mediaPlayer === player) {
                                  mediaPlayer = null
                              }
                          }

                      } catch (_: Exception) {
                          finish(false)
                      }
                  }

              private suspend fun speakAndroid(
                  text: String
              ): Boolean =
                  suspendCancellableCoroutine { continuation ->

                      val engine = tts

                      if (engine == null || !ready) {

                          if (continuation.isActive) {
                              continuation.resume(false)
                          }

                          return@suspendCancellableCoroutine
                      }

                      val id = UUID.randomUUID().toString()

                      engine.setOnUtteranceProgressListener(
                          object : UtteranceProgressListener() {

                              override fun onStart(
                                  utteranceId: String?
                              ) {}

                              override fun onDone(
                                  utteranceId: String?
                              ) {
                                  if (continuation.isActive) {
                                      continuation.resume(true)
                                  }
                              }

                              @Deprecated("Deprecated in Java")
                              override fun onError(
                                  utteranceId: String?
                              ) {
                                  if (continuation.isActive) {
                                      continuation.resume(false)
                                  }
                              }
                          }
                      )

                      val result = engine.speak(
                          text,
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          id
                      )

                      if (
                          result == TextToSpeech.ERROR &&
                          continuation.isActive
                      ) {
                          continuation.resume(false)
                      }

                      continuation.invokeOnCancellation {
                          engine.stop()
                      }
                  }

              fun stop() {

                  tts?.stop()

                  mediaPlayer?.runCatching {
                      stop()
                  }

                  mediaPlayer?.release()

                  mediaPlayer = null
              }

              fun shutdown() {

                  stop()

                  tts?.shutdown()

                  tts = null
              }
          }
          EOF

      - name: Wire SecurePrefs into TTS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/jarvis/assistant/di/AppContainer.kt"
          )

          text = path.read_text()

          old = "val textToSpeechManager = TextToSpeechManager(context)"
          new = "val textToSpeechManager = TextToSpeechManager(context, securePrefs)"

          if old not in text:
              raise SystemExit("TTS constructor line not found")

          path.write_text(
              text.replace(old, new, 1)
          )
          PY

      - name: Make old Android voice preference switch to OpenAI voice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/jarvis/assistant/ui/screens/settings/SettingsViewModel.kt"
          )

          text = path.read_text()

          old = """if (_state.value.voiceName == null) {
                      voices.firstOrNull { it.likelyMale }?.name?.let { updateVoice(it) }
                  }"""

          new = """if (
                          _state.value.voiceName == null ||
                          voices.none { it.name == _state.value.voiceName }
                      ) {
                          voices.firstOrNull { it.likelyMale }?.name?.let { updateVoice(it) }
                      }"""

          if old not in text:
              raise SystemExit("Voice initialization block not found")

          path.write_text(
              text.replace(old, new, 1)
          )
          PY

      - name: Verify
        shell: bash
        run: |
          set -e

          grep -n "gpt-4o-mini-tts" \
            app/src/main/kotlin/com/jarvis/assistant/voice/TextToSpeechManager.kt

          grep -n "v1/audio/speech" \
            app/src/main/kotlin/com/jarvis/assistant/voice/OpenAiTtsApi.kt

          grep -n "TextToSpeechManager(context, securePrefs)" \
            app/src/main/kotlin/com/jarvis/assistant/di/AppContainer.kt

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/kotlin/com/jarvis/assistant/voice/OpenAiTtsApi.kt \
            app/src/main/kotlin/com/jarvis/assistant/voice/TextToSpeechManager.kt \
            app/src/main/kotlin/com/jarvis/assistant/di/AppContainer.kt \
            app/src/main/kotlin/com/jarvis/assistant/ui/screens/settings/SettingsViewModel.kt

          git commit -m "Upgrade JARVIS speech to OpenAI TTS" || true
          git push

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle \
            :app:assembleDebug \
            -PAI_DEFAULT_MODEL="gpt-5.6-luna" \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-OpenAI-TTS-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build JARVIS OpenAI TTS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # OPENAI TTS API INTERFACE
      # ============================================================

      - name: Add OpenAI TTS API
        shell: bash
        run: |
          mkdir -p app/src/main/kotlin/com/jarvis/assistant/voice

          cat > app/src/main/kotlin/com/jarvis/assistant/voice/OpenAiTtsApi.kt <<'EOF'
          package com.jarvis.assistant.voice

          import com.google.gson.JsonObject
          import okhttp3.ResponseBody
          import retrofit2.http.Body
          import retrofit2.http.Header
          import retrofit2.http.POST

          interface OpenAiTtsApi {

              @POST("v1/audio/speech")
              suspend fun createSpeech(
                  @Header("Authorization") authHeader: String,
                  @Body request: JsonObject
              ): ResponseBody
          }
          EOF


      # ============================================================
      # OPENAI TTS MANAGER
      # ============================================================

      - name: Replace Android TTS with OpenAI TTS
        shell: bash
        run: |
          cat > app/src/main/kotlin/com/jarvis/assistant/voice/TextToSpeechManager.kt <<'EOF'
          package com.jarvis.assistant.voice

          import android.content.Context
          import android.media.MediaPlayer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import com.google.gson.JsonObject
          import com.jarvis.assistant.data.local.prefs.SecurePrefs
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import retrofit2.Retrofit
          import retrofit2.converter.gson.GsonConverterFactory
          import java.io.File
          import java.util.Locale
          import java.util.UUID
          import java.util.concurrent.TimeUnit
          import kotlin.coroutines.resume

          data class JarvisVoice(
              val name: String,
              val displayLabel: String,
              val likelyMale: Boolean
          )

          class TextToSpeechManager(
              context: Context,
              private val prefs: SecurePrefs
          ) {

              private val appContext =
                  context.applicationContext

              private var tts: TextToSpeech? = null

              private var ready = false

              private var mediaPlayer: MediaPlayer? =
                  null

              private var speechRate = 1.0f

              private var speechPitch = 1.0f

              private var selectedVoice = "cedar"

              /*
               * OpenAI TTS voices
               */
              private val voices =
                  listOf(

                      JarvisVoice(
                          "cedar",
                          "Cedar · OpenAI",
                          true
                      ),

                      JarvisVoice(
                          "marin",
                          "Marin · OpenAI",
                          false
                      ),

                      JarvisVoice(
                          "onyx",
                          "Onyx · OpenAI",
                          true
                      ),

                      JarvisVoice(
                          "ash",
                          "Ash · OpenAI",
                          true
                      ),

                      JarvisVoice(
                          "echo",
                          "Echo · OpenAI",
                          true
                      ),

                      JarvisVoice(
                          "ballad",
                          "Ballad · OpenAI",
                          true
                      ),

                      JarvisVoice(
                          "verse",
                          "Verse · OpenAI",
                          true
                      ),

                      JarvisVoice(
                          "alloy",
                          "Alloy · OpenAI",
                          false
                      ),

                      JarvisVoice(
                          "fable",
                          "Fable · OpenAI",
                          false
                      ),

                      JarvisVoice(
                          "coral",
                          "Coral · OpenAI",
                          false
                      ),

                      JarvisVoice(
                          "nova",
                          "Nova · OpenAI",
                          false
                      ),

                      JarvisVoice(
                          "sage",
                          "Sage · OpenAI",
                          false
                      ),

                      JarvisVoice(
                          "shimmer",
                          "Shimmer · OpenAI",
                          false
                      )
                  )

              /*
               * OpenAI API client
               */
              private val api: OpenAiTtsApi by lazy {

                  val client =
                      OkHttpClient.Builder()
                          .connectTimeout(
                              20,
                              TimeUnit.SECONDS
                          )
                          .readTimeout(
                              90,
                              TimeUnit.SECONDS
                          )
                          .writeTimeout(
                              30,
                              TimeUnit.SECONDS
                          )
                          .callTimeout(
                              120,
                              TimeUnit.SECONDS
                          )
                          .build()

                  Retrofit.Builder()
                      .baseUrl(
                          "https://api.openai.com/"
                      )
                      .client(client)
                      .addConverterFactory(
                          GsonConverterFactory.create()
                      )
                      .build()
                      .create(
                          OpenAiTtsApi::class.java
                      )
              }

              init {

                  selectedVoice =
                      prefs.voiceName
                          ?.takeIf { saved ->
                              voices.any {
                                  it.name == saved
                              }
                          }
                          ?: "cedar"

                  /*
                   * Android TTS remains only as fallback.
                   */
                  tts =
                      TextToSpeech(
                          appContext
                      ) { status ->

                          ready =
                              status ==
                                  TextToSpeech.SUCCESS

                          if (ready) {

                              tts?.setSpeechRate(
                                  speechRate
                              )

                              tts?.setPitch(
                                  speechPitch
                              )
                          }
                      }
              }

              fun setLanguage(
                  tag: String?
              ) {

                  val locale =
                      tag?.let {
                          Locale.forLanguageTag(it)
                      }
                          ?: Locale.getDefault()

                  tts?.language = locale
              }

              fun setRate(
                  rate: Float
              ) {

                  speechRate =
                      rate.coerceIn(
                          0.25f,
                          2.0f
                      )

                  tts?.setSpeechRate(
                      speechRate
                  )
              }

              fun setPitch(
                  pitch: Float
              ) {

                  speechPitch =
                      pitch.coerceIn(
                          0.5f,
                          2.0f
                      )

                  tts?.setPitch(
                      speechPitch
                  )
              }

              /*
               * Return OpenAI voices.
               */
              fun listVoices():
                  List<JarvisVoice> {

                  return voices
              }

              fun autoSelectMaleVoice():
                  String? {

                  return voices
                      .firstOrNull {
                          it.likelyMale
                      }
                      ?.name
              }

              fun setVoice(
                  name: String?
              ) {

                  if (
                      name.isNullOrBlank()
                  ) {
                      return
                  }

                  if (
                      voices.any {
                          it.name == name
                      }
                  ) {

                      selectedVoice =
                          name

                      prefs.voiceName =
                          name
                  }
              }

              /*
               * Main speech method.
               */
              suspend fun speak(
                  text: String
              ): Boolean {

                  val cleanText =
                      text.trim()

                  if (
                      cleanText.isBlank()
                  ) {
                      return true
                  }

                  /*
                   * Existing OpenAI API key
                   * from JARVIS settings.
                   */
                  val apiKey =
                      prefs.aiApiKey

                  /*
                   * OpenAI TTS.
                   */
                  if (
                      !apiKey.isNullOrBlank()
                  ) {

                      val result =
                          runCatching {

                              speakOpenAi(
                                  apiKey,
                                  cleanText
                              )

                          }.getOrDefault(false)

                      if (result) {
                          return true
                      }
                  }

                  /*
                   * Emergency Android fallback.
                   */
                  return speakAndroid(
                      cleanText
                  )
              }

              /*
               * Generate speech using OpenAI.
               */
              private suspend fun speakOpenAi(
                  apiKey: String,
                  text: String
              ): Boolean {

                  val request =
                      JsonObject().apply {

                          addProperty(
                              "model",
                              "gpt-4o-mini-tts"
                          )

                          addProperty(
                              "voice",
                              selectedVoice
                          )

                          addProperty(
                              "input",
                              text.take(4096)
                          )

                          addProperty(
                              "instructions",
                              """
                              Speak as a calm, deep, confident male AI assistant.

                              Use a low, warm, natural register.

                              Speak clearly with controlled pacing.

                              Sound intelligent, composed,
                              sophisticated and highly professional.

                              Use subtle authority.

                              Do not sound robotic.

                              Do not sound theatrical.

                              Do not exaggerate emotions.

                              Do not speak too quickly.

                              Maintain natural pauses between sentences.

                              Make the voice feel like an advanced
                              futuristic AI assistant similar to JARVIS.
                              """.trimIndent()
                          )

                          addProperty(
                              "response_format",
                              "mp3"
                          )

                          addProperty(
                              "speed",
                              speechRate.coerceIn(
                                  0.25f,
                                  4.0f
                              )
                          )
                      }

                  val audioFile =
                      File.createTempFile(
                          "jarvis_tts_",
                          ".mp3",
                          appContext.cacheDir
                      )

                  return try {

                      withContext(
                          Dispatchers.IO
                      ) {

                          val response =
                              api.createSpeech(
                                  authHeader =
                                      "Bearer $apiKey",
                                  request =
                                      request
                              )

                          response.use { body ->

                              body
                                  .byteStream()
                                  .use { input ->

                                      audioFile
                                          .outputStream()
                                          .use { output ->

                                              input.copyTo(
                                                  output
                                              )
                                          }
                                  }
                          }
                      }

                      playFile(
                          audioFile
                      )

                  } catch (
                      _: Exception
                  ) {

                      false

                  } finally {

                      audioFile.delete()
                  }
              }

              /*
               * Play generated MP3.
               */
              private suspend fun playFile(
                  file: File
              ): Boolean =
                  suspendCancellableCoroutine { continuation ->

                      val player =
                          MediaPlayer()

                      mediaPlayer
                          ?.runCatching {
                              stop()
                          }

                      mediaPlayer?.release()

                      mediaPlayer =
                          player

                      fun finish(
                          success: Boolean
                      ) {

                          if (
                              mediaPlayer === player
                          ) {
                              mediaPlayer =
                                  null
                          }

                          runCatching {
                              player.release()
                          }

                          if (
                              continuation.isActive
                          ) {

                              continuation.resume(
                                  success
                              )
                          }
                      }

                      try {

                          player.setDataSource(
                              file.absolutePath
                          )

                          player.setOnPreparedListener {

                              if (
                                  continuation.isActive
                              ) {

                                  it.start()
                              }
                          }

                          player.setOnCompletionListener {

                              finish(true)
                          }

                          player.setOnErrorListener {
                                  _,
                                  _,
                                  _ ->

                              finish(false)

                              true
                          }

                          player.prepare()

                          continuation
                              .invokeOnCancellation {

                                  runCatching {
                                      player.stop()
                                  }

                                  runCatching {
                                      player.release()
                                  }

                                  if (
                                      mediaPlayer === player
                                  ) {

                                      mediaPlayer =
                                          null
                                  }
                              }

                      } catch (
                          _: Exception
                      ) {

                          finish(false)
                      }
                  }

              /*
               * Android TTS fallback.
               */
              private suspend fun speakAndroid(
                  text: String
              ): Boolean =
                  suspendCancellableCoroutine { continuation ->

                      val engine =
                          tts

                      if (
                          engine == null ||
                          !ready
                      ) {

                          if (
                              continuation.isActive
                          ) {

                              continuation.resume(
                                  false
                              )
                          }

                          return@suspendCancellableCoroutine
                      }

                      val utteranceId =
                          UUID.randomUUID()
                              .toString()

                      engine
                          .setOnUtteranceProgressListener(

                              object :
                                  UtteranceProgressListener() {

                                  override fun onStart(
                                      utteranceId:
                                      String?
                                  ) {
                                  }

                                  override fun onDone(
                                      utteranceId:
                                      String?
                                  ) {

                                      if (
                                          continuation
                                              .isActive
                                      ) {

                                          continuation.resume(
                                              true
                                          )
                                      }
                                  }

                                  @Deprecated(
                                      "Deprecated in Java"
                                  )
                                  override fun onError(
                                      utteranceId:
                                      String?
                                  ) {

                                      if (
                                          continuation
                                              .isActive
                                      ) {

                                          continuation.resume(
                                              false
                                          )
                                      }
                                  }
                              }
                          )

                      val result =
                          engine.speak(
                              text,
                              TextToSpeech
                                  .QUEUE_FLUSH,
                              null,
                              utteranceId
                          )

                      if (
                          result ==
                          TextToSpeech.ERROR &&
                          continuation.isActive
                      ) {

                          continuation.resume(
                              false
                          )
                      }

                      continuation
                          .invokeOnCancellation {
                              engine.stop()
                          }
                  }

              fun stop() {

                  tts?.stop()

                  mediaPlayer
                      ?.runCatching {
                          stop()
                      }

                  mediaPlayer?.release()

                  mediaPlayer = null
              }

              fun shutdown() {

                  stop()

                  tts?.shutdown()

                  tts = null
              }
          }
          EOF


      # ============================================================
      # CONNECT SECURE PREFS
      # ============================================================

      - name: Wire SecurePrefs into TTS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/kotlin/com/jarvis/assistant/di/AppContainer.kt"
          )

          text = path.read_text()

          old = "TextToSpeechManager(context)"

          new = "TextToSpeechManager(context, securePrefs)"

          if old not in text:
              raise SystemExit(
                  "TextToSpeechManager constructor not found"
              )

          path.write_text(
              text.replace(
                  old,
                  new,
                  1
              )
          )

          print(
              "SecurePrefs successfully connected."
          )
          PY


      # ============================================================
      # SIMPLE VERIFICATION
      # ============================================================

      - name: Verify OpenAI TTS
        shell: bash
        run: |
          set -e

          echo "Checking OpenAI TTS model..."

          grep -q \
            "gpt-4o-mini-tts" \
            app/src/main/kotlin/com/jarvis/assistant/voice/TextToSpeechManager.kt

          echo "OK: TTS model"

          echo "Checking Speech API..."

          grep -q \
            "v1/audio/speech" \
            app/src/main/kotlin/com/jarvis/assistant/voice/OpenAiTtsApi.kt

          echo "OK: Speech API"

          echo "Checking SecurePrefs..."

          grep -q \
            "TextToSpeechManager(context, securePrefs)" \
            app/src/main/kotlin/com/jarvis/assistant/di/AppContainer.kt

          echo "OK: SecurePrefs"

          echo "Checking TTS voices..."

          grep -q \
            '"cedar"' \
            app/src/main/kotlin/com/jarvis/assistant/voice/TextToSpeechManager.kt

          echo "OK: Cedar"

          grep -q \
            '"marin"' \
            app/src/main/kotlin/com/jarvis/assistant/voice/TextToSpeechManager.kt

          echo "OK: Marin"

          echo "Checking completed successfully."


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build APK
        run: |
          gradle \
            :app:assembleDebug \
            -PAI_DEFAULT_MODEL="gpt-5.6-luna" \
            --stacktrace


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload OpenAI TTS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-OpenAI-TTS-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build JARVIS OpenAI Web Search

on:
  workflow_dispatch:
  push:
    paths:
      - "JARVISAssistant1-OpenAI-WebSearch-ready.zip"
      - ".github/workflows/build-ready.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract prepared project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f -name 'JARVISAssistant1-OpenAI-WebSearch-ready.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "Prepared ZIP was not found."
            exit 1
          fi

          echo "Using: $ZIP"

          rm -rf extracted-project
          mkdir extracted-project

          unzip -q "$ZIP" -d extracted-project

          ROOT="$(find extracted-project -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          if [ -z "$ROOT" ]; then
            echo "Could not find project directory inside ZIP."
            exit 1
          fi

          echo "Project root: $ROOT"

          cp -a "$ROOT"/. .

          echo "Checking Android project..."

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project found successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          gradle \
            :app:assembleDebug \
            -PAI_DEFAULT_MODEL="gpt-5.6-luna" \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Built APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-OpenAI-WebSearch-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

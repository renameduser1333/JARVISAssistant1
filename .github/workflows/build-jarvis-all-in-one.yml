name: Build JARVIS Voice Persistent Audio Upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-jarvis-all-in-one.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Patch continuous speech recognition and persistent MP3 TTS
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import base64
          
          root = Path("app/src/main/kotlin/com/jarvis/assistant")
          
          speech = base64.b64decode("").decode()
          tts = base64.b64decode("").decode()
          tts_api = base64.b64decode("").decode()
          
          (root / "voice/SpeechToTextManager.kt").write_text(speech, encoding="utf-8")
          (root / "voice/TextToSpeechManager.kt").write_text(tts, encoding="utf-8")
          (root / "voice/OpenAiTtsApi.kt").write_text(tts_api, encoding="utf-8")
          
          p = root / "di/AppContainer.kt"
          s = p.read_text()
          s = s.replace(
              "val textToSpeechManager = TextToSpeechManager(context)",
              "val textToSpeechManager = TextToSpeechManager(context, securePrefs)"
          )
          p.write_text(s)
          
          manifest = Path("app/src/main/AndroidManifest.xml")
          ms = manifest.read_text()
          if "android.speech.RecognitionService" not in ms:
              ms = ms.replace(
                  "    <queries>\n",
                  "    <queries>\n"
                  "        <intent>\n"
                  "            <action android:name=\"android.speech.RecognitionService\" />\n"
                  "        </intent>\n"
              )
          manifest.write_text(ms)
          
          gradle = Path("app/build.gradle.kts")
          gs = gradle.read_text()
          gs = gs.replace('?: "gpt-4o-mini"', '?: "gpt-5.6-luna"')
          gradle.write_text(gs)
          PY

      - name: Add local ChatGPT archive import and retrieval
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          
          root = Path("app/src/main/kotlin/com/jarvis/assistant")
          
          importer = r'''
          package com.jarvis.assistant.data.repository
          
          import android.content.Context
          import android.net.Uri
          import com.jarvis.assistant.data.local.db.entity.KnowledgeEntity
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.zip.ZipFile
          
          data class ChatGptImportResult(
              val conversations: Int,
              val messages: Int,
              val files: Int
          )
          
          class ChatGptArchiveImporter(
              private val context: Context,
              private val conversations: ConversationRepository,
              private val knowledge: KnowledgeRepository
          ) {
              suspend fun importZip(uri: Uri): ChatGptImportResult {
                  val work = File(
                      context.cacheDir,
                      "chatgpt_import_" + System.currentTimeMillis()
                  ).apply { mkdirs() }
          
                  val zipFile = File(work, "export.zip")
          
                  context.contentResolver.openInputStream(uri).use { input ->
                      requireNotNull(input) { "Could not open the selected export." }
                      zipFile.outputStream().use { output -> input.copyTo(output) }
                  }
          
                  var conversationCount = 0
                  var messageCount = 0
                  var fileCount = 0
          
                  ZipFile(zipFile).use { zip ->
                      val jsonEntries = zip.entries().asSequence()
                          .filter { !it.isDirectory }
                          .filter {
                              val name = it.name.substringAfterLast('/')
                              name.equals("conversations.json", true) ||
                                  name.matches(
                                      Regex(
                                          "conversations_[0-9]+\\.json",
                                          RegexOption.IGNORE_CASE
                                      )
                                  )
                          }
                          .toList()
          
                      for (entry in jsonEntries) {
                          val text = zip.getInputStream(entry)
                              .bufferedReader()
                              .use { it.readText() }
          
                          val array = JSONArray(text)
          
                          for (i in 0 until array.length()) {
                              val conversation = array.optJSONObject(i) ?: continue
                              val title = conversation.optString("title")
                                  .ifBlank { "Imported ChatGPT conversation" }
          
                              val localId = conversations.createConversation(
                                  "ChatGPT · " + title
                              )
          
                              var imported = 0
                              val mapping = conversation.optJSONObject("mapping")
          
                              if (mapping != null) {
                                  val nodes = mapping.keys().asSequence()
                                      .mapNotNull { mapping.optJSONObject(it) }
                                      .sortedBy {
                                          it.optDouble("create_time", 0.0)
                                      }
          
                                  for (node in nodes) {
                                      val message =
                                          node.optJSONObject("message") ?: continue
          
                                      val role = message
                                          .optJSONObject("author")
                                          ?.optString("role")
                                          .orEmpty()
          
                                      if (role != "user" && role != "assistant") continue
          
                                      val content =
                                          extractContent(message.optJSONObject("content"))
          
                                      if (content.isBlank()) continue
          
                                      val timestamp = (
                                          message.optDouble(
                                              "create_time",
                                              conversation.optDouble("create_time", 0.0)
                                          ) * 1000.0
                                      ).toLong().takeIf { it > 0 }
                                          ?: System.currentTimeMillis()
          
                                      conversations.addImportedMessage(
                                          localId,
                                          role,
                                          content,
                                          timestamp
                                      )
          
                                      imported++
                                      messageCount++
                                  }
                              }
          
                              if (imported > 0) conversationCount++
                          }
                      }
          
                      val fileRoot = File(
                          context.filesDir,
                          "chatgpt_import/files"
                      ).apply { mkdirs() }
          
                      val textFiles = mutableListOf<KnowledgeEntity>()
          
                      zip.entries().asSequence()
                          .filter { !it.isDirectory }
                          .forEach { entry ->
                              val base = entry.name.substringAfterLast('/')
          
                              if (base.equals("conversations.json", true)) {
                                  return@forEach
                              }
          
                              if (
                                  base.matches(
                                      Regex(
                                          "conversations_[0-9]+\\.json",
                                          RegexOption.IGNORE_CASE
                                      )
                                  )
                              ) {
                                  return@forEach
                              }
          
                              val safeName = entry.name
                                  .replace("..", "_")
                                  .replace("\\", "_")
                                  .trimStart('/')
          
                              val output = File(fileRoot, safeName)
                              output.parentFile?.mkdirs()
          
                              zip.getInputStream(entry).use { input ->
                                  output.outputStream().use { out -> input.copyTo(out) }
                              }
          
                              fileCount++
          
                              val ext = output.extension.lowercase()
                              if (
                                  ext in setOf(
                                      "txt", "md", "json", "csv", "xml", "log"
                                  )
                              ) {
                                  val content = runCatching {
                                      output.readText(Charsets.UTF_8).take(120000)
                                  }.getOrDefault("")
          
                                  if (content.isNotBlank()) {
                                      textFiles += KnowledgeEntity(
                                          externalId =
                                              "chatgpt_file:" +
                                                  safeName.hashCode().toString(),
                                          category = "chatgpt_archive",
                                          topic = safeName,
                                          content =
                                              "Imported ChatGPT file: " +
                                                  safeName + "\n" + content,
                                          keywords = safeName
                                              .replace(
                                                  Regex("[^A-Za-zА-Яа-я0-9]+"),
                                                  " "
                                              )
                                              .lowercase(),
                                          source = "custom"
                                      )
                                  }
                              }
                          }
          
                      if (textFiles.isNotEmpty()) {
                          knowledge.upsertCustom(textFiles)
                      }
                  }
          
                  zipFile.delete()
                  work.deleteRecursively()
          
                  return ChatGptImportResult(
                      conversationCount,
                      messageCount,
                      fileCount
                  )
              }
          
              private fun extractContent(content: JSONObject?): String {
                  if (content == null) return ""
          
                  val parts = content.optJSONArray("parts") ?: return ""
                  val out = StringBuilder()
          
                  for (i in 0 until parts.length()) {
                      when (val part = parts.opt(i)) {
                          is String -> out.append(part).append('\n')
                          is JSONObject -> {
                              val text = part.optString("text")
                              if (text.isNotBlank()) {
                                  out.append(text).append('\n')
                              }
                          }
                      }
                  }
          
                  return out.toString().trim()
              }
          }
          '''
          
          p = root / "data/repository/ChatGptArchiveImporter.kt"
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(importer.lstrip(), encoding="utf-8")
          
          # Conversation search.
          # ConversationDao.kt also contains MessageDao, so add the query to
          # the MessageDao interface where the messages table is defined.
          p = root / "data/local/db/dao/ConversationDao.kt"
          s = p.read_text()
          if "suspend fun searchMessages(query: String" not in s:
              needle = '''    @Insert
              suspend fun insert(message: MessageEntity): Long
          '''
              addition = needle + '''
              @Query("SELECT * FROM messages WHERE content LIKE '%' || :query || '%' ORDER BY timestamp DESC LIMIT :limit")
              suspend fun searchMessages(query: String, limit: Int = 30): List<MessageEntity>
          '''
              s = s.replace(needle, addition)
          p.write_text(s)
          
          p = root / "data/repository/ConversationRepository.kt"
          s = p.read_text()
          if "addImportedMessage" not in s:
              needle = '''    suspend fun addMessage(conversationId: Long, role: String, content: String) {
                  messageDao.insert(MessageEntity(conversationId = conversationId, role = role, content = content))
              }
          '''
              addition = needle + '''
              suspend fun addImportedMessage(
                  conversationId: Long,
                  role: String,
                  content: String,
                  timestamp: Long
              ) {
                  messageDao.insert(
                      MessageEntity(
                          conversationId = conversationId,
                          role = role,
                          content = content,
                          timestamp = timestamp
                      )
                  )
              }
          
              suspend fun searchMessages(
                  query: String,
                  limit: Int = 30
              ): List<MessageEntity> =
                  messageDao.searchMessages(query, limit)
          '''
              s = s.replace(needle, addition)
          p.write_text(s)
          
          # Knowledge insertion.
          p = root / "data/repository/KnowledgeRepository.kt"
          s = p.read_text()
          if "upsertCustom" not in s:
              needle = '    suspend fun totalCount(): Int = dao.totalCount()\n'
              s = s.replace(
                  needle,
                  needle + '''
              suspend fun upsertCustom(entries: List<KnowledgeEntity>) {
                  if (entries.isNotEmpty()) dao.upsertAll(entries)
              }
          '''
              )
          p.write_text(s)
          
          # Wire importer.
          p = root / "di/AppContainer.kt"
          s = p.read_text()
          s = s.replace("import com.jarvis.assistant.data.repository.KnowledgeRepository", "import com.jarvis.assistant.data.repository.KnowledgeRepository\nimport com.jarvis.assistant.data.repository.ChatGptArchiveImporter")
          if "chatGptArchiveImporter" not in s:
              needle = "    val knowledgeRepository = KnowledgeRepository(context, database.knowledgeDao())\n"
              s = s.replace(
                  needle,
                  needle +
                  "    val chatGptArchiveImporter = ChatGptArchiveImporter(context, conversationRepository, knowledgeRepository)\n"
              )
          p.write_text(s)
          
          # Settings VM.
          p = root / "ui/screens/settings/SettingsViewModel.kt"
          s = p.read_text()
          if "chatGptImportStatus" not in s:
              marker = '    val state: StateFlow<SettingsState> = _state.asStateFlow()\n'
              addition = marker + '''
              private val _chatGptImportStatus = MutableStateFlow("")
              val chatGptImportStatus: StateFlow<String> = _chatGptImportStatus.asStateFlow()
          
              fun importChatGptArchive(uri: Uri) {
                  viewModelScope.launch {
                      _chatGptImportStatus.value = "Importing ChatGPT archive..."
                      runCatching {
                          container.chatGptArchiveImporter.importZip(uri)
                      }.onSuccess { result ->
                          _chatGptImportStatus.value =
                              "Imported " + result.conversations +
                                  " conversations, " + result.messages +
                                  " messages, " + result.files + " files."
                      }.onFailure { error ->
                          _chatGptImportStatus.value =
                              "Import failed: " +
                                  (error.message ?: "unknown error")
                      }
                  }
              }
          '''
              s = s.replace(marker, addition)
          p.write_text(s)
          
          # Make the existing voice-list lambdas explicit for Kotlin compiler inference.
          p = root / "ui/screens/settings/SettingsViewModel.kt"
          s = p.read_text()
          s = s.replace(
              "repeat(10) {",
              "repeat(10) { _: Int ->"
          )
          s = s.replace(
              "val voices = container.textToSpeechManager.listVoices()",
              "val voices: List<JarvisVoice> = container.textToSpeechManager.listVoices()"
          )
          s = s.replace(
              "voices.firstOrNull { it.likelyMale }?.name?.let { updateVoice(it) }",
              "voices.firstOrNull { voice: JarvisVoice -> voice.likelyMale }?.name?.let { name: String -> updateVoice(name) }"
          )
          p.write_text(s)
          
          # Settings UI.
          p = root / "ui/screens/settings/SettingsScreen.kt"
          s = p.read_text()
          
          if "rememberLauncherForActivityResult" not in s:
              s = s.replace(
                  "import androidx.compose.runtime.setValue\n",
                  "import androidx.compose.runtime.setValue\n"
                  "import androidx.activity.compose.rememberLauncherForActivityResult\n"
                  "import androidx.activity.result.contract.ActivityResultContracts\n"
              )
          
          if "chatGptImportLauncher" not in s:
              marker = '    var voiceMenuExpanded by remember { mutableStateOf(false) }\n'
              addition = marker + '''
              val chatGptImportLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null) viewModel.importChatGptArchive(uri)
              }
          
              val chatGptImportStatus by
                  viewModel.chatGptImportStatus.collectAsState()
          '''
              s = s.replace(marker, addition)
          
          if "Import ChatGPT data" not in s:
              marker = '        SectionLabel("Voice")\n'
              addition = '''
                  SectionLabel("ChatGPT Archive")
                  Text(
                      "Import your ChatGPT export ZIP. Conversations go into the local Room database; exported files are copied to JARVIS private storage. Relevant local text is retrieved before an API request.",
                      color = JarvisTextSecondary,
                      style = MaterialTheme.typography.labelSmall,
                      modifier = Modifier.padding(
                          horizontal = 16.dp,
                          vertical = 4.dp
                      )
                  )
          
                  OutlinedButton(
                      onClick = {
                          chatGptImportLauncher.launch(
                              arrayOf(
                                  "application/zip",
                                  "application/octet-stream",
                                  "*/*"
                              )
                          )
                      },
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 16.dp, vertical = 6.dp)
                  ) {
                      Text("Import ChatGPT data")
                  }
          
                  if (chatGptImportStatus.isNotBlank()) {
                      Text(
                          chatGptImportStatus,
                          color = JarvisCyan,
                          style = MaterialTheme.typography.labelSmall,
                          modifier = Modifier.padding(
                              horizontal = 16.dp,
                              vertical = 4.dp
                          )
                      )
                  }
          
          '''
              s = s.replace(marker, addition + marker)
          
          p.write_text(s)
          
          # Local archive retrieval in OpenAI service.
          p = root / "ai/OpenAiService.kt"
          s = p.read_text()
          
          if "LOCAL CHAT ARCHIVE" not in s:
              marker = "            val conversation = history\n"
              if marker in s:
                  prefix = """            val query = history.lastOrNull {
                          it.role.equals("user", true)
                      }?.content.orEmpty()
          
                      val terms = query
                          .split(Regex("\\\\s+"))
                          .map { it.trim { c -> !c.isLetterOrDigit() } }
                          .filter { it.length >= 4 }
                          .distinct()
                          .take(5)
          
                      val archive = terms
                          .flatMap { term ->
                              runCatching {
                                  com.jarvis.assistant.JarvisApplication
                                      .instance
                                      .container
                                      .conversationRepository
                                      .searchMessages(term, 8)
                              }.getOrDefault(emptyList())
                          }
                          .distinctBy { it.id }
                          .take(16)
          
                      val archiveContext = archive.joinToString("\\n\\n") {
                          "LOCAL CHAT ARCHIVE [" + it.role + "]: " +
                              it.content.take(5000)
                      }
          
          """
                  s = s.replace(marker, prefix + marker, 1)
          
                  input_marker = "            val input = if (conversation.isBlank()) {"
                  request_marker = "            val request = JsonObject().apply"
                  input_start = s.find(input_marker)
                  request_start = s.find(request_marker, input_start)
                  if input_start >= 0 and request_start > input_start:
                      new_input = """            val input = buildString {
                          if (archiveContext.isNotBlank()) {
                              append("Relevant local archive context follows. Treat it as historical user-provided material.\\n\\n")
                              append(archiveContext)
                              append("\\n\\n")
                          }
                          if (conversation.isBlank()) {
                              append("USER: Please answer the user's request.")
                          } else {
                              append(conversation)
                          }
                      }
          
          """
                      s = s[:input_start] + new_input + s[request_start:]
          
          p.write_text(s)
          # Make the global application accessor available.
          p = root / "JarvisApplication.kt"
          s = p.read_text()
          if "companion object" not in s:
              s = s.replace(
                  "class JarvisApplication : Application() {",
                  "class JarvisApplication : Application() {\n    companion object { lateinit var instance: JarvisApplication }"
              )
          if "instance = this" not in s:
              s = s.replace(
                  "override fun onCreate() {",
                  "override fun onCreate() {\n        instance = this"
              )
          p.write_text(s)
          PY


      - name: Preflight validate patched source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main/kotlin/com/jarvis/assistant")
          required = [
              root / "voice/SpeechToTextManager.kt",
              root / "voice/TextToSpeechManager.kt",
              root / "voice/OpenAiTtsApi.kt",
              root / "data/repository/ChatGptArchiveImporter.kt",
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit("Missing patched file(s): " + ", ".join(missing))

          tts = (root / "voice/TextToSpeechManager.kt").read_text()
          assert "lateinit var local: TextToSpeech" in tts
          assert 'local = TextToSpeech(appContext)' in tts
          assert '@POST("v1/audio/speech")' in (root / "voice/OpenAiTtsApi.kt").read_text()
          assert "Response<ResponseBody>" in (root / "voice/OpenAiTtsApi.kt").read_text()
          assert "searchMessages(query: String" in (root / "data/local/db/dao/ConversationDao.kt").read_text()
          assert "addImportedMessage(" in (root / "data/repository/ConversationRepository.kt").read_text()
          assert "importChatGptArchive(" in (root / "ui/screens/settings/SettingsViewModel.kt").read_text()
          assert "rememberLauncherForActivityResult" in (root / "ui/screens/settings/SettingsScreen.kt").read_text()
          assert "Import ChatGPT data" in (root / "ui/screens/settings/SettingsScreen.kt").read_text()
          assert "companion object { lateinit var instance" in (root / "JarvisApplication.kt").read_text()
          assert "instance = this" in (root / "JarvisApplication.kt").read_text()
          tts_body = (root / "voice/TextToSpeechManager.kt").read_text()
          assert "body.body()?.byteStream()" in tts_body
          assert "private val prefs: SecurePrefs = SecurePrefs(context)" in tts_body
          app_container = (root / "di/AppContainer.kt").read_text()
          assert "import com.jarvis.assistant.data.repository.ChatGptArchiveImporter" in app_container
          assert "ChatGptArchiveImporter(context, conversationRepository, knowledgeRepository)" in app_container
          boot = (root / "ui/screens/boot/BootScreen.kt").read_text()
          assert "TextToSpeechManager(context)" in boot
          settings = (root / "ui/screens/settings/SettingsViewModel.kt").read_text()
          assert "repeat(10) { _: Int ->" in settings
          assert "val voices: List<JarvisVoice>" in settings
          assert "voice: JarvisVoice -> voice.likelyMale" in settings
          openai = (root / "ai/OpenAiService.kt").read_text()
          assert r'Regex("```jarvis_command\\s*' in openai
          assert r'Regex("```jarvis_command\s*' not in openai
          assert 'gpt-5.6-luna' in Path("app/build.gradle.kts").read_text()
          print("Preflight source validation: OK")
          PY

      - name: Build upgraded APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug \
            -PAI_DEFAULT_MODEL="gpt-5.6-luna" \
            -PAI_DEFAULT_API_KEY="" \
            -PAI_DEFAULT_BASE_URL="https://api.openai.com/"

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Voice-Persistent-Audio-Upgrade
          path: app/build/outputs/apk/debug/*.apk

name: Build JARVIS Voice Persistent Audio Upgrade
# Manual build trigger

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-jarvis-all-in-one.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Patch continuous speech recognition and persistent MP3 TTS
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          root = Path("app/src/main/kotlin/com/jarvis/assistant")

          speech = r'''
package com.jarvis.assistant.voice

import android.content.Context
import android.content.Intent
import android.os.Bundle
import android.speech.RecognitionListener
import android.speech.RecognizerIntent
import android.speech.SpeechRecognizer
import kotlinx.coroutines.channels.awaitClose
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.Flow
import kotlinx.coroutines.flow.callbackFlow
import kotlinx.coroutines.launch

sealed class SpeechEvent {
    data class PartialResult(val text: String) : SpeechEvent()
    data class FinalResult(val text: String) : SpeechEvent()
    data class Error(val message: String) : SpeechEvent()
    object ListeningStarted : SpeechEvent()
    object ListeningEnded : SpeechEvent()
}

class SpeechToTextManager(private val context: Context) {
    private var recognizer: SpeechRecognizer? = null
    @Volatile private var cancelled = false

    fun isAvailable(): Boolean = SpeechRecognizer.isRecognitionAvailable(context)

    fun listen(languageTag: String?): Flow<SpeechEvent> = callbackFlow {
        if (!isAvailable()) {
            trySend(SpeechEvent.Error("Speech recognition isn't available on this device."))
            close()
            return@callbackFlow
        }

        cancelled = false
        var transcript = ""
        var lastResult = ""

        fun startSession() {
            if (cancelled) return
            recognizer?.runCatching { stopListening(); cancel(); destroy() }

            val sr = SpeechRecognizer.createSpeechRecognizer(context)
            recognizer = sr

            sr.setRecognitionListener(object : RecognitionListener {
                override fun onReadyForSpeech(params: Bundle?) {
                    trySend(SpeechEvent.ListeningStarted)
                }

                override fun onBeginningOfSpeech() {}
                override fun onRmsChanged(rmsdB: Float) {}
                override fun onBufferReceived(buffer: ByteArray?) {}

                override fun onEndOfSpeech() {
                    trySend(SpeechEvent.ListeningEnded)
                }

                override fun onPartialResults(partialResults: Bundle?) {
                    val partial = partialResults
                        ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                        ?.firstOrNull()
                        ?.trim()
                        .orEmpty()

                    if (partial.isNotBlank()) {
                        val preview = if (transcript.isBlank()) {
                            partial
                        } else {
                            transcript + " " + partial
                        }
                        trySend(SpeechEvent.PartialResult(preview.trim()))
                    }
                }

                override fun onResults(results: Bundle?) {
                    if (cancelled) return

                    val result = results
                        ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                        ?.firstOrNull()
                        ?.trim()
                        .orEmpty()

                    if (result.isNotBlank() && result != lastResult) {
                        transcript = if (transcript.isBlank()) {
                            result
                        } else {
                            transcript + " " + result
                        }
                        lastResult = result
                        trySend(SpeechEvent.PartialResult(transcript.trim()))
                    }

                    launch {
                        delay(180)
                        if (!cancelled) startSession()
                    }
                }

                override fun onError(error: Int) {
                    if (cancelled) return

                    when (error) {
                        SpeechRecognizer.ERROR_NO_MATCH,
                        SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> {
                            if (transcript.isNotBlank()) {
                                trySend(SpeechEvent.FinalResult(transcript.trim()))
                                close()
                            } else {
                                launch {
                                    delay(250)
                                    if (!cancelled) startSession()
                                }
                            }
                        }

                        SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> {
                            launch {
                                delay(400)
                                if (!cancelled) startSession()
                            }
                        }

                        else -> {
                            trySend(SpeechEvent.Error(errorMessage(error)))
                            close()
                        }
                    }
                }

                override fun onEvent(eventType: Int, params: Bundle?) {}
            })

            val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                putExtra(
                    RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                    RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                )
                putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                putExtra(
                    RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS,
                    6000L
                )
                putExtra(
                    RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS,
                    4500L
                )
                putExtra(
                    RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS,
                    2500L
                )
                if (!languageTag.isNullOrBlank()) {
                    putExtra(RecognizerIntent.EXTRA_LANGUAGE, languageTag)
                }
            }

            runCatching { sr.startListening(intent) }
                .onFailure {
                    if (!cancelled) {
                        trySend(
                            SpeechEvent.Error(
                                "Could not start speech recognition."
                            )
                        )
                    }
                }
        }

        startSession()

        awaitClose {
            cancelled = true
            recognizer?.runCatching {
                stopListening()
                cancel()
                destroy()
            }
            recognizer = null
        }
    }

    @Synchronized
    fun cancel() {
        cancelled = true
        recognizer?.runCatching {
            stopListening()
            cancel()
            destroy()
        }
        recognizer = null
    }

    private fun errorMessage(error: Int): String = when (error) {
        SpeechRecognizer.ERROR_NO_MATCH -> "I didn't catch that."
        SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> "No speech detected."
        SpeechRecognizer.ERROR_NETWORK,
        SpeechRecognizer.ERROR_NETWORK_TIMEOUT ->
            "Network error during speech recognition."
        SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS ->
            "Microphone permission is needed."
        SpeechRecognizer.ERROR_RECOGNIZER_BUSY ->
            "Speech recognizer is busy, try again."
        else -> "Speech recognition error."
    }
}
'''

          tts = r'''
package com.jarvis.assistant.voice

import android.content.Context
import android.media.MediaPlayer
import android.speech.tts.TextToSpeech
import com.google.gson.JsonObject
import com.jarvis.assistant.data.local.prefs.SecurePrefs
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.Job
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow
import kotlinx.coroutines.launch
import kotlinx.coroutines.suspendCancellableCoroutine
import okhttp3.OkHttpClient
import retrofit2.Retrofit
import retrofit2.converter.gson.GsonConverterFactory
import java.io.File
import java.util.Locale
import java.util.UUID
import java.util.concurrent.TimeUnit
import kotlin.coroutines.resume

data class JarvisVoice(
    val name: String,
    val displayLabel: String,
    val likelyMale: Boolean
)

data class AudioPlayerState(
    val filePath: String? = null,
    val title: String = "JARVIS audio",
    val isPlaying: Boolean = false,
    val positionMs: Int = 0,
    val durationMs: Int = 0,
    val chunkIndex: Int = 0,
    val totalChunks: Int = 0
)

class TextToSpeechManager(
    context: Context,
    private val prefs: SecurePrefs
) {
    private val appContext = context.applicationContext
    private val audioDir = File(appContext.filesDir, "jarvis_audio").apply { mkdirs() }
    private val scope = CoroutineScope(Dispatchers.Main.immediate)

    private var player: MediaPlayer? = null
    private var playlist: List<File> = emptyList()
    private var index = 0
    private var completion: ((Boolean) -> Unit)? = null
    private var progressJob: Job? = null
    private var speechRate = 1.0f
    private var speechPitch = 1.0f
    private var selectedVoice = "cedar"

    private val _audioState = MutableStateFlow(AudioPlayerState())
    val audioState: StateFlow<AudioPlayerState> = _audioState.asStateFlow()

    private val voices = listOf(
        JarvisVoice("cedar", "Cedar · OpenAI", true),
        JarvisVoice("marin", "Marin · OpenAI", false),
        JarvisVoice("onyx", "Onyx · OpenAI", true),
        JarvisVoice("ash", "Ash · OpenAI", true),
        JarvisVoice("echo", "Echo · OpenAI", true),
        JarvisVoice("ballad", "Ballad · OpenAI", true),
        JarvisVoice("verse", "Verse · OpenAI", true),
        JarvisVoice("alloy", "Alloy · OpenAI", false),
        JarvisVoice("fable", "Fable · OpenAI", false),
        JarvisVoice("coral", "Coral · OpenAI", false),
        JarvisVoice("nova", "Nova · OpenAI", false),
        JarvisVoice("sage", "Sage · OpenAI", false),
        JarvisVoice("shimmer", "Shimmer · OpenAI", false)
    )

    private val api: OpenAiTtsApi by lazy {
        Retrofit.Builder()
            .baseUrl("https://api.openai.com/")
            .client(
                OkHttpClient.Builder()
                    .connectTimeout(20, TimeUnit.SECONDS)
                    .readTimeout(90, TimeUnit.SECONDS)
                    .writeTimeout(30, TimeUnit.SECONDS)
                    .callTimeout(120, TimeUnit.SECONDS)
                    .build()
            )
            .addConverterFactory(GsonConverterFactory.create())
            .build()
            .create(OpenAiTtsApi::class.java)
    }

    init {
        selectedVoice = prefs.voiceName
            ?.takeIf { saved -> voices.any { it.name == saved } }
            ?: "cedar"

        val latest = audioDir.listFiles()
            ?.filter { it.extension.equals("mp3", true) }
            ?.maxByOrNull { it.lastModified() }

        if (latest != null) {
            _audioState.value = AudioPlayerState(
                filePath = latest.absolutePath,
                title = "Saved JARVIS MP3",
                isPlaying = false,
                positionMs = 0,
                durationMs = 0,
                chunkIndex = 0,
                totalChunks = 1
            )
            playlist = listOf(latest)
        }
    }

    fun setLanguage(tag: String?) {
        tag?.let { Locale.forLanguageTag(it) }
    }

    fun setRate(rate: Float) {
        speechRate = rate.coerceIn(0.25f, 2.0f)
    }

    fun setPitch(pitch: Float) {
        speechPitch = pitch.coerceIn(0.5f, 2.0f)
    }

    fun listVoices(): List<JarvisVoice> = voices

    fun autoSelectMaleVoice(): String? =
        voices.firstOrNull { it.likelyMale }?.name

    fun setVoice(name: String?) {
        if (name.isNullOrBlank()) return
        if (voices.none { it.name == name }) return
        selectedVoice = name
        prefs.voiceName = name
    }

    suspend fun speak(text: String): Boolean {
        val clean = text.trim()
        if (clean.isBlank()) return true

        stopInternal(false)

        val key = prefs.aiApiKey
        if (key.isNullOrBlank()) {
            return speakAndroid(clean)
        }

        val generated = mutableListOf<File>()

        return try {
            splitForSpeech(clean).forEachIndexed { i, chunk ->
                val file = File(
                    audioDir,
                    "jarvis_" + System.currentTimeMillis() +
                        "_" + i + "_" + UUID.randomUUID() + ".mp3"
                )

                val request = JsonObject().apply {
                    addProperty("model", "gpt-4o-mini-tts")
                    addProperty("voice", selectedVoice)
                    addProperty("input", chunk)
                    addProperty(
                        "instructions",
                        "Speak as JARVIS: calm, deep, warm, confident, " +
                            "intelligent and natural. Use subtle pauses and " +
                            "varied intonation. Never sound robotic."
                    )
                    addProperty("response_format", "mp3")
                    addProperty(
                        "speed",
                        speechRate.toDouble().coerceIn(0.25, 4.0)
                    )
                }

                val body = api.createSpeech("Bearer " + key, request)

                if (!body.isSuccessful) {
                    error("TTS HTTP " + body.code())
                }

                body.byteStream().use { input ->
                    file.outputStream().use { output -> input.copyTo(output) }
                }

                if (file.length() == 0L) error("Empty TTS audio")
                generated += file
            }

            playlist = generated
            index = 0
            playCurrent()
            awaitPlayback()
        } catch (_: Exception) {
            generated.forEach { it.delete() }
            speakAndroid(clean)
        }
    }

    private fun splitForSpeech(text: String): List<String> {
        val max = 3600
        if (text.length <= max) return listOf(text)

        val result = mutableListOf<String>()
        var remaining = text.trim()

        while (remaining.length > max) {
            var cut = -1

            for (i in max downTo 1200) {
                val c = remaining[i]
                if (
                    c == '.' || c == '!' || c == '?' ||
                    c == '\n' || c == '。' || c == '！' || c == '？'
                ) {
                    cut = i
                    break
                }
            }

            if (cut < 1) cut = remaining.lastIndexOf(' ', max)
            if (cut < 1) cut = max

            result += remaining.substring(0, cut + 1).trim()
            remaining = remaining.substring(cut + 1).trim()
        }

        if (remaining.isNotBlank()) result += remaining
        return result
    }

    private suspend fun awaitPlayback(): Boolean =
        suspendCancellableCoroutine { cont ->
            completion = { ok ->
                if (cont.isActive) cont.resume(ok)
            }
            cont.invokeOnCancellation { stopInternal(false) }
        }

    private fun playCurrent() {
        val file = playlist.getOrNull(index) ?: run {
            finishPlayback(true)
            return
        }

        player?.release()

        player = MediaPlayer().apply {
            setDataSource(file.absolutePath)

            setOnPreparedListener {
                _audioState.value = AudioPlayerState(
                    filePath = file.absolutePath,
                    title = "JARVIS · part " +
                        (index + 1) + "/" + playlist.size,
                    isPlaying = true,
                    positionMs = 0,
                    durationMs = it.duration,
                    chunkIndex = index,
                    totalChunks = playlist.size
                )
                it.start()
                startProgressUpdates()
            }

            setOnCompletionListener {
                if (index + 1 < playlist.size) {
                    index++
                    playCurrent()
                } else {
                    finishPlayback(true)
                }
            }

            setOnErrorListener { _, _, _ ->
                finishPlayback(false)
                true
            }

            prepareAsync()
        }
    }

    private fun startProgressUpdates() {
        progressJob?.cancel()

        progressJob = scope.launch {
            while (player != null) {
                val p = player ?: break

                _audioState.value = _audioState.value.copy(
                    isPlaying =
                        runCatching { p.isPlaying }.getOrDefault(false),
                    positionMs =
                        runCatching { p.currentPosition }.getOrDefault(0),
                    durationMs =
                        runCatching { p.duration }.getOrDefault(0),
                    chunkIndex = index,
                    totalChunks = playlist.size
                )

                delay(250)
            }
        }
    }

    private fun finishPlayback(ok: Boolean) {
        progressJob?.cancel()
        player?.release()
        player = null

        _audioState.value =
            _audioState.value.copy(isPlaying = false)

        val done = completion
        completion = null
        done?.invoke(ok)
    }

    fun pauseAudio() {
        player?.pause()
        _audioState.value =
            _audioState.value.copy(isPlaying = false)
    }

    fun resumeAudio() {
        player?.start()
        _audioState.value =
            _audioState.value.copy(isPlaying = true)
    }

    fun restartAudio() {
        player?.seekTo(0)
        player?.start()
        _audioState.value =
            _audioState.value.copy(
                isPlaying = true,
                positionMs = 0
            )
    }

    fun previousAudio() {
        if (index > 0) {
            index--
            playCurrent()
        } else {
            restartAudio()
        }
    }

    fun nextAudio() {
        if (index + 1 < playlist.size) {
            index++
            playCurrent()
        }
    }

    fun seekAudio(positionMs: Int) {
        player?.seekTo(positionMs.coerceAtLeast(0))
    }

    fun stop() {
        stopInternal(true)
    }

    private fun stopInternal(resolve: Boolean) {
        progressJob?.cancel()
        runCatching { player?.stop() }
        player?.release()
        player = null

        if (resolve) {
            val done = completion
            completion = null
            done?.invoke(false)
        }

        _audioState.value =
            _audioState.value.copy(isPlaying = false)
    }

    private suspend fun speakAndroid(text: String): Boolean =
        suspendCancellableCoroutine { cont ->
            val local = TextToSpeech(appContext) { status ->
                if (status != TextToSpeech.SUCCESS) {
                    if (cont.isActive) cont.resume(false)
                    return@TextToSpeech
                }

                val id = UUID.randomUUID().toString()
                local.setSpeechRate(speechRate)
                local.setPitch(speechPitch)

                local.setOnUtteranceProgressListener(
                    object : android.speech.tts.UtteranceProgressListener() {
                        override fun onStart(utteranceId: String?) {}

                        override fun onDone(utteranceId: String?) {
                            local.shutdown()
                            if (cont.isActive) cont.resume(true)
                        }

                        override fun onError(utteranceId: String?) {
                            local.shutdown()
                            if (cont.isActive) cont.resume(false)
                        }
                    }
                )

                if (
                    local.speak(
                        text,
                        TextToSpeech.QUEUE_FLUSH,
                        null,
                        id
                    ) == TextToSpeech.ERROR
                ) {
                    local.shutdown()
                    if (cont.isActive) cont.resume(false)
                }
            }

            cont.invokeOnCancellation {
                runCatching { local.shutdown() }
            }
        }

    fun shutdown() {
        stopInternal(false)
    }
}
'''


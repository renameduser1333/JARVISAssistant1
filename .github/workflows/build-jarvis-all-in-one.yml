      - name: Add local ChatGPT archive import and retrieval
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          root = Path("app/src/main/kotlin/com/jarvis/assistant")

          importer = r'''
package com.jarvis.assistant.data.repository

import android.content.Context
import android.net.Uri
import com.jarvis.assistant.data.local.db.entity.KnowledgeEntity
import org.json.JSONArray
import org.json.JSONObject
import java.io.File
import java.util.zip.ZipFile

data class ChatGptImportResult(
    val conversations: Int,
    val messages: Int,
    val files: Int
)

class ChatGptArchiveImporter(
    private val context: Context,
    private val conversations: ConversationRepository,
    private val knowledge: KnowledgeRepository
) {
    suspend fun importZip(uri: Uri): ChatGptImportResult {
        val work = File(
            context.cacheDir,
            "chatgpt_import_" + System.currentTimeMillis()
        ).apply { mkdirs() }

        val zipFile = File(work, "export.zip")

        context.contentResolver.openInputStream(uri).use { input ->
            requireNotNull(input) { "Could not open the selected export." }
            zipFile.outputStream().use { output -> input.copyTo(output) }
        }

        var conversationCount = 0
        var messageCount = 0
        var fileCount = 0

        ZipFile(zipFile).use { zip ->
            val jsonEntries = zip.entries().asSequence()
                .filter { !it.isDirectory }
                .filter {
                    val name = it.name.substringAfterLast('/')
                    name.equals("conversations.json", true) ||
                        name.matches(
                            Regex(
                                "conversations_[0-9]+\\.json",
                                RegexOption.IGNORE_CASE
                            )
                        )
                }
                .toList()

            for (entry in jsonEntries) {
                val text = zip.getInputStream(entry)
                    .bufferedReader()
                    .use { it.readText() }

                val array = JSONArray(text)

                for (i in 0 until array.length()) {
                    val conversation = array.optJSONObject(i) ?: continue
                    val title = conversation.optString("title")
                        .ifBlank { "Imported ChatGPT conversation" }

                    val localId = conversations.createConversation(
                        "ChatGPT · " + title
                    )

                    var imported = 0
                    val mapping = conversation.optJSONObject("mapping")

                    if (mapping != null) {
                        val nodes = mapping.keys().asSequence()
                            .mapNotNull { mapping.optJSONObject(it) }
                            .sortedBy {
                                it.optDouble("create_time", 0.0)
                            }

                        for (node in nodes) {
                            val message =
                                node.optJSONObject("message") ?: continue

                            val role = message
                                .optJSONObject("author")
                                ?.optString("role")
                                .orEmpty()

                            if (role != "user" && role != "assistant") continue

                            val content =
                                extractContent(message.optJSONObject("content"))

                            if (content.isBlank()) continue

                            val timestamp = (
                                message.optDouble(
                                    "create_time",
                                    conversation.optDouble("create_time", 0.0)
                                ) * 1000.0
                            ).toLong().takeIf { it > 0 }
                                ?: System.currentTimeMillis()

                            conversations.addImportedMessage(
                                localId,
                                role,
                                content,
                                timestamp
                            )

                            imported++
                            messageCount++
                        }
                    }

                    if (imported > 0) conversationCount++
                }
            }

            val fileRoot = File(
                context.filesDir,
                "chatgpt_import/files"
            ).apply { mkdirs() }

            val textFiles = mutableListOf<KnowledgeEntity>()

            zip.entries().asSequence()
                .filter { !it.isDirectory }
                .forEach { entry ->
                    val base = entry.name.substringAfterLast('/')

                    if (base.equals("conversations.json", true)) {
                        return@forEach
                    }

                    if (
                        base.matches(
                            Regex(
                                "conversations_[0-9]+\\.json",
                                RegexOption.IGNORE_CASE
                            )
                        )
                    ) {
                        return@forEach
                    }

                    val safeName = entry.name
                        .replace("..", "_")
                        .replace("\\", "_")
                        .trimStart('/')

                    val output = File(fileRoot, safeName)
                    output.parentFile?.mkdirs()

                    zip.getInputStream(entry).use { input ->
                        output.outputStream().use { out -> input.copyTo(out) }
                    }

                    fileCount++

                    val ext = output.extension.lowercase()
                    if (
                        ext in setOf(
                            "txt", "md", "json", "csv", "xml", "log"
                        )
                    ) {
                        val content = runCatching {
                            output.readText(Charsets.UTF_8).take(120000)
                        }.getOrDefault("")

                        if (content.isNotBlank()) {
                            textFiles += KnowledgeEntity(
                                externalId =
                                    "chatgpt_file:" +
                                        safeName.hashCode().toString(),
                                category = "chatgpt_archive",
                                topic = safeName,
                                content =
                                    "Imported ChatGPT file: " +
                                        safeName + "\n" + content,
                                keywords = safeName
                                    .replace(
                                        Regex("[^A-Za-zА-Яа-я0-9]+"),
                                        " "
                                    )
                                    .lowercase(),
                                source = "custom"
                            )
                        }
                    }
                }

            if (textFiles.isNotEmpty()) {
                knowledge.upsertCustom(textFiles)
            }
        }

        zipFile.delete()
        work.deleteRecursively()

        return ChatGptImportResult(
            conversationCount,
            messageCount,
            fileCount
        )
    }

    private fun extractContent(content: JSONObject?): String {
        if (content == null) return ""

        val parts = content.optJSONArray("parts") ?: return ""
        val out = StringBuilder()

        for (i in 0 until parts.length()) {
            when (val part = parts.opt(i)) {
                is String -> out.append(part).append('\n')
                is JSONObject -> {
                    val text = part.optString("text")
                    if (text.isNotBlank()) {
